name: Backend tests

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "api/**"
      - "Makefile"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "api/**"
      - "Makefile"
      - ".github/workflows/backend.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - run: make test-backend
