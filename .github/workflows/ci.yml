name: Chores App CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  JDK_VERSION: '24'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-java-gradle
        with:
          java-version: ${{ env.JDK_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - run: npm ci
      - run: make lint
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: detekt-report
          path: build/reports/detekt/detekt.html
          if-no-files-found: ignore

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-java-gradle
        with:
          java-version: ${{ env.JDK_VERSION }}
      - run: make test
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          if-no-files-found: ignore

  build-desktop:
    name: Build Desktop
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-java-gradle
        with:
          java-version: ${{ env.JDK_VERSION }}
      - run: make build-desktop
      - uses: actions/upload-artifact@v6
        with:
          name: desktop-deb
          path: '**/build/compose/binaries/main/**/*.deb'
          if-no-files-found: ignore

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-java-gradle
        with:
          java-version: ${{ env.JDK_VERSION }}
      - run: make build-android
      - uses: actions/upload-artifact@v6
        with:
          name: android-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: ignore

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    needs: test

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-java-gradle
        with:
          java-version: ${{ env.JDK_VERSION }}
      - run: make build-ios
      - uses: actions/upload-artifact@v6
        with:
          name: ios-frameworks
          path: '**/build/bin/ios*/debugFramework/*.framework'
          if-no-files-found: ignore

  docs-build:
    name: Documentation Build
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8.3.2
      - run: make docs-build

  docs-deploy:
    name: Documentation Deploy
    runs-on: ubuntu-latest
    needs: docs-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v8.3.2
      - run: make docs-deploy

  ci-success:
    name: CI Passed
    runs-on: ubuntu-latest
    needs: [ lint, test, build-desktop, build-android, build-ios, docs-build ]
    if: always()

    steps:
      - run: |
          if [ "${{ needs.lint.result }}"            != "success" ] || \
             [ "${{ needs.test.result }}"            != "success" ] || \
             [ "${{ needs.build-desktop.result }}"   != "success" ] || \
             [ "${{ needs.build-android.result }}"   != "success" ] || \
             [ "${{ needs.build-ios.result }}"       != "success" ] || \
             [ "${{ needs.docs-build.result }}"            != "success" ]; then
            echo "One or more jobs failed."
            exit 1
          fi
          echo "All jobs passed successfully!"
