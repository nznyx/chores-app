name: Frontend tests

on:
  push:
    paths:
      - "frontend/**"
      - "api/**"
      - "Makefile"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "api/**"
      - "Makefile"
      - ".github/workflows/frontend.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: "24"
          distribution: temurin
          cache: gradle
      - run: make test-frontend
