name: Kotlin frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "api/**"
      - "Makefile"
      - ".github/workflows/frontend.yml"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend-changes:
    name: Kotlin frontend change detection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.detect.outputs.relevant }}

    steps:
      - name: Check out repository history
        if: github.event_name == 'pull_request'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Detect relevant changes
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$EVENT_NAME" == "push" ]] || ! git diff --quiet "$BASE_SHA" HEAD -- frontend api Makefile .github/workflows/frontend.yml; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  kotlin-format:
    name: Kotlin formatting
    needs: frontend-changes
    if: needs.frontend-changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Java and Gradle cache
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: "24"
          distribution: temurin
          cache: gradle
      - name: Check Kotlin formatting
        run: make check-kotlin-format

  kotlin-static-analysis:
    name: Kotlin static analysis
    needs: frontend-changes
    if: needs.frontend-changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Java and Gradle cache
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: "24"
          distribution: temurin
          cache: gradle
      - name: Run Detekt static analysis
        run: make lint-kotlin-detekt

  kotlin-jvm-tests:
    name: Kotlin/JVM tests
    needs: frontend-changes
    if: needs.frontend-changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Java and Gradle cache
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: "24"
          distribution: temurin
          cache: gradle
      - name: Run Kotlin/JVM tests
        run: make test-frontend-jvm

  android-unit-tests:
    name: Android unit tests
    needs: frontend-changes
    if: needs.frontend-changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Java and Gradle cache
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: "24"
          distribution: temurin
          cache: gradle
      - name: Run Android unit tests
        run: make test-frontend-android

  javascript-tests:
    name: JavaScript tests
    needs: frontend-changes
    if: needs.frontend-changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Java and Gradle cache
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: "24"
          distribution: temurin
          cache: gradle
      - name: Run JavaScript tests
        run: make test-frontend-js

  webassembly-tests:
    name: WebAssembly tests
    needs: frontend-changes
    if: needs.frontend-changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Java and Gradle cache
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: "24"
          distribution: temurin
          cache: gradle
      - name: Run WebAssembly tests
        run: make test-frontend-wasm

  kotlin-frontend-gate:
    name: Kotlin frontend all clear
    needs: [frontend-changes, kotlin-format, kotlin-static-analysis, kotlin-jvm-tests, android-unit-tests, javascript-tests, webassembly-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify Kotlin frontend jobs
        env:
          RELEVANT: ${{ needs.frontend-changes.outputs.relevant }}
          CHANGE_DETECTION: ${{ needs.frontend-changes.result }}
          KOTLIN_FORMAT: ${{ needs.kotlin-format.result }}
          KOTLIN_STATIC_ANALYSIS: ${{ needs.kotlin-static-analysis.result }}
          JVM_TESTS: ${{ needs.kotlin-jvm-tests.result }}
          ANDROID_TESTS: ${{ needs.android-unit-tests.result }}
          JAVASCRIPT_TESTS: ${{ needs.javascript-tests.result }}
          WEBASSEMBLY_TESTS: ${{ needs.webassembly-tests.result }}
        run: |
          if [[ "$CHANGE_DETECTION" != "success" ]]; then
            echo "::error::Kotlin change detection failed"
            exit 1
          fi
          if [[ "$RELEVANT" == "true" ]]; then
            expected="success"
          elif [[ "$RELEVANT" == "false" ]]; then
            expected="skipped"
          else
            echo "::error::Kotlin change detection produced no decision"
            exit 1
          fi
          for result in "$KOTLIN_FORMAT" "$KOTLIN_STATIC_ANALYSIS" "$JVM_TESTS" "$ANDROID_TESTS" "$JAVASCRIPT_TESTS" "$WEBASSEMBLY_TESTS"; do
            if [[ "$result" != "$expected" ]]; then
              echo "::error::Expected Kotlin job status $expected, received $result"
              exit 1
            fi
          done
